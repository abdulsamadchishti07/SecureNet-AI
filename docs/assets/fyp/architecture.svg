   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(12.78 320.49093)">Default: dry_run. Enforcement needs explicit --enforce. Only the helper changes rules.</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(12.78 333.693938)">Notifications default off; separate thread, 600s/IP cooldown, at most 30 logical alert attempts/hour.</text>
   </g>
